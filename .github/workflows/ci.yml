name: Application tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        application: ['.', 'paulinho-pastel-app']
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm test -- --runInBand --roots src
